<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Retro Border Frame -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="16 8"/>
  
  <!-- Pixel Gamepad / Heart Emblem -->
  <g transform="translate(106, 80)">
    <!-- Retro Pixel CKY & W Emblem -->
    <!-- Aura halo -->
    <circle cx="150" cy="120" r="110" fill="#ec4899" opacity="0.25"/>
    <circle cx="150" cy="120" r="90" fill="#a855f7" opacity="0.3"/>
    
    <!-- Pixel Backpack Icon -->
    <rect x="100" y="70" width="100" height="110" rx="16" fill="#ec4899"/>
    <rect x="115" y="50" width="70" height="30" rx="8" fill="none" stroke="#fbcfe8" stroke-width="8"/>
    <rect x="110" y="100" width="80" height="50" rx="8" fill="#db2777"/>
    <circle cx="150" cy="125" r="8" fill="#fef08a"/>

    <!-- W Orbital Star -->
    <circle cx="210" cy="70" r="16" fill="url(#goldGrad)"/>
    <circle cx="210" cy="70" r="24" fill="#fde047" opacity="0.4"/>
  </g>

  <!-- Title Badge -->
  <rect x="96" y="320" width="320" height="76" rx="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="6"/>
  <text x="256" y="372" text-anchor="middle" font-family="'Courier New', monospace, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" letter-spacing="6">CKY RPG</text>
  
  <!-- 8-Bit Pixel Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="monospace, sans-serif" font-size="22" font-weight="bold" fill="#fef08a" letter-spacing="4">★ ANDROID EDITION ★</text>
</svg>
